name: test
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  pull_request: { types: [opened, reopened, synchronize, ready_for_review] }
  push: { branches: [ main ] }
env:
  MYSQL_DATABASE: 'test_database'
  MYSQL_USERNAME: 'test_username'
  MYSQL_PASSWORD: 'test_password'
  MYSQL_HOSTNAME: 'mysql-a'

jobs:
  api-breakage:
    permissions:
      contents: read
    if: ${{ !(github.event.pull_request.draft || false) }}
    runs-on: ubuntu-latest
    container: swift:noble
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with: { 'fetch-depth': 0 }
      - name: Run API breakage check
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          swift package diagnose-api-breaking-changes "origin/${GITHUB_BASE_REF:-${GITHUB_REF_NAME}}"

  linux-insecure-test:
    permissions:
      contents: read
    if: ${{ !(github.event.pull_request.draft || false) }}
    strategy:
      fail-fast: false
      matrix:
        dbimage:
          - mysql:9.7
        swiftver:
          - swift:6.3-noble
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.swiftver }}
      volumes: [ 'mysqlshare:/var/run/mysqld' ]
    services:
      mysql-a:
        image: ${{ matrix.dbimage }}
        volumes: [ 'mysqlshare:/var/run/mysqld' ]
        env: { MYSQL_ALLOW_EMPTY_PASSWORD: true, MYSQL_USER: test_username, MYSQL_PASSWORD: test_password, MYSQL_DATABASE: test_database }
    steps:
      - name: Force MySQL server to disallow TLS
        shell: bash
        run: |
          apt-get update && apt-get install -y 'mysql-client-core-*' curl
          i=0; while ((i<10)); do
            { mysql -BS/var/run/mysqld/mysqld.sock <<<"SET PERSIST ssl_ca='',ssl_cert='',ssl_key='';ALTER INSTANCE RELOAD TLS NO ROLLBACK ON ERROR;" ; } && break
            sleep 2
            i=$((i+1))
          done
          ((i<10))
      - name: Check out package
        uses: actions/checkout@v7
      - name: Run unit tests
        run: swift test --enable-code-coverage
      - name: Upload code coverage
        uses: vapor/swift-codecov-action@2f478f2fd22e06ca363967d0fb6c6593a8548cee # v0.3.5
        with:
          codecov_token: ${{ secrets.CODECOV_TOKEN }}
  
  linux-all:
    permissions:
      contents: read
    if: ${{ !(github.event.pull_request.draft || false) }}
    strategy:
      fail-fast: false
      matrix:
        dbimage:
          - mysql:5.7
          - mysql:9.7
          - mariadb:10.6
          - mariadb:12
          - percona:5.7
          - percona:8
        swiftver:
          - swift:6.2-noble
          - swift:6.3-noble
          - swiftlang/swift:nightly-main-noble
    runs-on: ubuntu-latest
    container: ${{ matrix.swiftver }}
    services:
      mysql-a:
        image: ${{ matrix.dbimage }}
        env: { MYSQL_ALLOW_EMPTY_PASSWORD: true, MYSQL_USER: test_username, MYSQL_PASSWORD: test_password, MYSQL_DATABASE: test_database }
      mysql-b:
        image: ${{ matrix.dbimage }}
        env: { MYSQL_ALLOW_EMPTY_PASSWORD: true, MYSQL_USER: test_username, MYSQL_PASSWORD: test_password, MYSQL_DATABASE: test_database }
    steps:
      - name: Install curl
        run: apt-get update -y -q && apt-get install -y curl
      - name: Check out package
        uses: actions/checkout@v7
        with: { path: 'mysql-nio' }
      - name: Run unit tests
        run: swift test --package-path mysql-nio --enable-code-coverage
      - name: Upload code coverage
        uses: vapor/swift-codecov-action@2f478f2fd22e06ca363967d0fb6c6593a8548cee # v0.3.5
        with:
          codecov_token: ${{ secrets.CODECOV_TOKEN }}
          package_path: 'mysql-nio'
      # - name: Check out mysql-kit dependent
      #   uses: actions/checkout@v7
      #   with: { repository: 'vapor/mysql-kit', path: 'mysql-kit' }
      # - name: Check out fluent-mysql-driver dependent
      #   uses: actions/checkout@v7
      #   with: { repository: 'vapor/fluent-mysql-driver', path: 'fluent-mysql-driver' }
      # - name: Use local package in dependents
      #   run: |
      #     swift package --package-path mysql-kit edit mysql-nio --path mysql-nio
      #     swift package --package-path fluent-mysql-driver edit mysql-nio --path mysql-nio
      # - name: Run mysql-kit tests
      #   run: swift test --package-path mysql-kit
      # - name: Run fluent-mysql-driver tests
      #   run: swift test --package-path fluent-mysql-driver

  macos-all:
    permissions:
      contents: read
    if: ${{ !(github.event.pull_request.draft || false) }}
    strategy:
      fail-fast: false
      matrix:
        dbimage: [mysql, mariadb, percona-server]
        macos-version: ['macos-15', 'macos-26']
        include:
          - { username: root }
          - { dbimage: mariadb, username: runner }
          - { macos-version: 'macos-15', xcode-version: 'latest-stable' }
          - { macos-version: 'macos-26', xcode-version: 'latest-stable' }
    runs-on: ${{ matrix.macos-version }}
    env: { MYSQL_HOSTNAME: '127.0.0.1' }
    steps:
      - name: Select latest available Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with: 
          xcode-version: ${{ matrix.xcode-version }}
      - name: Install MySQL, setup DB and auth, and wait for server start
        env:
          FORMULA: ${{ matrix.dbimage }}
          RUNAS_USER: ${{ matrix.username }}
        shell: bash
        run: |
          brew install "${FORMULA}" && brew link --force "${FORMULA}"
          brew services start "${FORMULA}"
          until echo | mysql -u"${RUNAS_USER}"; do sleep 1; done
          mysql -u"${RUNAS_USER}" --batch <<-SQL
              CREATE USER ${MYSQL_USERNAME}@localhost IDENTIFIED BY '${MYSQL_PASSWORD}';
              CREATE DATABASE ${MYSQL_DATABASE};
              GRANT ALL PRIVILEGES ON ${MYSQL_DATABASE}.* TO ${MYSQL_USERNAME}@localhost;
          SQL
        timeout-minutes: 5
      - name: Check out code
        uses: actions/checkout@v7
      - name: Run all tests
        run: swift test --enable-code-coverage
      - name: Upload code coverage
        uses: vapor/swift-codecov-action@2f478f2fd22e06ca363967d0fb6c6593a8548cee # v0.3.5
        with:
          codecov_token: ${{ secrets.CODECOV_TOKEN }}

  ios-build:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
    - name: Select appropriate Xcode version
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
    - name: Check out code
      uses: actions/checkout@v7
    - name: Xcodebuild
      run: |
        xcodebuild build -scheme mysql-nio -destination 'platform=iOS Simulator,name=iPhone 17'

  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Build for Android
        uses: skiptools/swift-android-action@2044b79660f201ccef8cbce62877e4ec5409f9c8 # v2.9.5
        with:
          build-tests: true
          run-tests: false

  submit-dependencies:
    permissions:
      contents: write
    if: ${{ github.event_name == 'push' }}
    uses: vapor/ci/.github/workflows/submit-deps.yml@main
    secrets: inherit

  foundation-linking:
    uses: vapor/ci/.github/workflows/check-foundation-linking.yml@main
    permissions:
      contents: read
    with:
      swift_image: swift:6.3-noble

  lint:
    runs-on: ubuntu-latest
    container: swift:noble
    timeout-minutes: 5
    steps:
      - name: Configure git
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"
      - name: Check out code
        uses: actions/checkout@v7
      - name: Lint
        run: |
          apt -q update && apt -yq install curl
          curl -s https://raw.githubusercontent.com/swiftlang/github-workflows/refs/heads/main/.github/workflows/scripts/check-swift-format.sh | bash
